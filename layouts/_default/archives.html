{{ define "main" }}
<h1>Archive</h1>
{{ $posts := where .Site.RegularPages "Section" "posts" }}
{{ range ($posts.GroupByDate "2006") }}
<h2 class="archive-year">{{ .Key }}</h2>
<ul class="post-list">
  {{ range .Pages }}
  <li class="post-entry">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02" }}</time>
    <a href="{{ .Permalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
{{ end }}
