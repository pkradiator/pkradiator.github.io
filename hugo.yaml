baseURL: "https://pkradiator.github.io/"
languageCode: en-us
title: "Radiator's Thoughts"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
minifyOutput: true

params:
  author: Priyanshu Kalal
  description: "Mathematics, Computer Science, Physics, Electronics — and the occasional shenanigan."
  math: true

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 30

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - - \[
              - \]
          inline:
            - - \(
              - \)
        enable: true
